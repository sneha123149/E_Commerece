<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .brand-logo {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.5rem;
        }
        .hero-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border-radius: 16px;
            padding: 40px 20px;
        }
        .product-card {
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }
        .product-img {
            height: 220px;
            object-fit: cover;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }
        .btn-accent {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: 600;
        }
        .btn-accent:hover {
            background-color: var(--accent-hover);
            color: white;
        }
        .badge-category {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .checkout-container {
            max-width: 900px;
            margin: auto;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-body shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo text-primary" href="javascript:void(0)" onclick="switchView('storeView')">
                <i class="fa-solid fa-bolt me-2"></i>AURA
            </a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm rounded-circle" onclick="toggleTheme()" id="themeBtn">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn btn-outline-dark position-relative rounded-pill px-3" onclick="switchView('checkoutView')">
                    <i class="fa-solid fa-bag-shopping me-1"></i> Cart
                    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- STORE FRONT VIEW -->
    <main id="storeView" class="view-section active container py-4">
        <!-- Hero Section -->
        <div class="hero-banner shadow-sm mb-4 text-center">
            <span class="badge bg-white text-dark rounded-pill px-3 py-2 fw-semibold mb-2">New Season Arrivals</span>
            <h1 class="fw-black display-5">Next-Gen Essentials</h1>
            <p class="lead opacity-90">Premium gear delivered directly to your doorstep.</p>
        </div>

        <!-- Search and Filter Bar -->
        <div class="row g-3 mb-4 align-items-center">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-body border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search products..." onkeyup="filterProducts()">
                </div>
            </div>
            <div class="col-md-6 d-flex gap-2 overflow-auto pb-1" id="categoryFilters">
                <button class="btn btn-sm btn-dark rounded-pill px-3 active-cat" onclick="filterCategory('All', this)">All</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="filterCategory('Audio', this)">Audio</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="filterCategory('Wearables', this)">Wearables</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="filterCategory('Accessories', this)">Accessories</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="row g-4" id="productGrid"></div>
    </main>

    <!-- DIRECT CHECKOUT VIEW -->
    <main id="checkoutView" class="view-section container py-4">
        <div class="checkout-container">
            <button class="btn btn-link text-decoration-none text-muted mb-3 p-0" onclick="switchView('storeView')">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Shopping
            </button>
            
            <div class="row g-4">
                <!-- Order Summary -->
                <div class="col-lg-5 order-lg-2">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Order Summary</h5>
                        <div id="checkoutItems" class="mb-3"></div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total</span>
                            <span>$<span id="checkoutTotal">0.00</span></span>
                        </div>
                    </div>
                </div>

                <!-- Customer Form -->
                <div class="col-lg-7 order-lg-1">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Shipping & Contact Details</h5>
                        <form id="checkoutForm" onsubmit="submitOrder(event)">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Full Name</label>
                                    <input type="text" class="form-control" id="custName" placeholder="Alex Morgan" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Phone Number</label>
                                    <input type="tel" class="form-control" id="custPhone" placeholder="+1 (555) 000-0000" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Delivery Address</label>
                                    <textarea class="form-control" id="custAddress" rows="3" placeholder="Street Address, City, Zip Code" required></textarea>
                                </div>
                            </div>
                            
                            <button type="submit" id="submitBtn" class="btn btn-accent btn-lg w-100 mt-4 rounded-3">
                                <span id="btnText">Confirm Order</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="actionToast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Item added to cart</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCiw8HW8smC9W0KhJg3iFdo7EF4vz0dvF6I3u-tUCVg1MWpULy2c-bAQlVLfxQKsdU/exec";

        const products = [
            { id: 1, name: "Noise-Canceling Headphones", price: 199.99, category: "Audio", rating: 4.8, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
            { id: 2, name: "Smart Watch Series X", price: 249.99, category: "Wearables", rating: 4.9, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
            { id: 3, name: "Minimalist Leather Backpack", price: 120.00, category: "Accessories", rating: 4.7, img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" },
            { id: 4, name: "Bluetooth Sound Speaker", price: 79.99, category: "Audio", rating: 4.5, img: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500&q=80" },
            { id: 5, name: "Wireless Charging Pad", price: 39.99, category: "Accessories", rating: 4.4, img: "https://images.unsplash.com/photo-1622445268465-840246e904b6?w=500&q=80" },
            { id: 6, name: "Fitness Tracker Band", price: 59.99, category: "Wearables", rating: 4.6, img: "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=500&q=80" }
        ];

        let cart = [];

        function renderProducts(itemsToRender = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = itemsToRender.map(product => `
                <div class="col-6 col-md-4 col-lg-4">
                    <div class="card product-card h-100 bg-body">
                        <img src="${product.img}" class="card-img-top product-img" alt="${product.name}">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="badge bg-secondary-subtle text-secondary badge-category">${product.category}</span>
                                <small class="text-warning"><i class="fa-solid fa-star"></i> ${product.rating}</small>
                            </div>
                            <h6 class="card-title fw-bold text-truncate">${product.name}</h6>
                            <p class="fw-bold text-primary mb-3">$${product.price.toFixed(2)}</p>
                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm w-50" onclick="addToCart(${product.id})">
                                    <i class="fa-solid fa-cart-plus"></i> Cart
                                </button>
                                <button class="btn btn-accent btn-sm w-50" onclick="buyNow(${product.id})">
                                    Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId, showNotification = true) {
            const item = cart.find(p => p.id === productId);
            if (item) {
                item.qty += 1;
            } else {
                const product = products.find(p => p.id === productId);
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            if (showNotification) showToast("Item added to cart!");
        }

        function buyNow(productId) {
            addToCart(productId, false);
            switchView('checkoutView');
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const checkoutItems = document.getElementById('checkoutItems');
            const checkoutTotal = document.getElementById('checkoutTotal');

            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.textContent = totalCount;
            checkoutTotal.textContent = totalPrice.toFixed(2);

            if (cart.length === 0) {
                checkoutItems.innerHTML = `<p class="text-center text-muted my-3">Your cart is empty.</p>`;
                return;
            }

            checkoutItems.innerHTML = cart.map(item => `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h6 class="mb-0 fw-semibold">${item.name}</h6>
                        <small class="text-muted">$${item.price.toFixed(2)} x ${item.qty}</small>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="mx-2 fw-semibold">${item.qty}</span>
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            const item = cart.find(p => p.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(p => p.id !== id);
                }
            }
            updateCartUI();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('#categoryFilters button').forEach(b => {
                b.classList.remove('btn-dark');
                b.classList.add('btn-outline-secondary');
            });
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-dark');

            if (cat === 'All') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeBtn = document.getElementById('themeBtn');
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        }

        function showToast(msg) {
            document.getElementById('toastMessage').textContent = msg;
            const toast = new bootstrap.Toast(document.getElementById('actionToast'));
            toast.show();
        }

        async function submitOrder(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            submitBtn.disabled = true;
            btnText.textContent = "Processing...";
            btnSpinner.classList.remove('d-none');

            const itemsSummary = cart.map(i => `${i.name} (x${i.qty})`).join(', ');
            const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0).toFixed(2);

            const formData = new URLSearchParams();
            formData.append("name", document.getElementById('custName').value);
            formData.append("phone", document.getElementById('custPhone').value);
            formData.append("address", document.getElementById('custAddress').value);
            formData.append("items", itemsSummary);
            formData.append("total", "$" + totalAmount);

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                alert("Order Placed Successfully!");
                cart = [];
                updateCartUI();
                document.getElementById('checkoutForm').reset();
                switchView('storeView');

            } catch (err) {
                alert("Failed to place order. Please try again.");
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Confirm Order";
                btnSpinner.classList.add('d-none');
            }
        }

        renderProducts();
    </script>
</body>
</html>
